# Тег v* → проверенный NSIS/updater draft. Публикация остаётся ручной.
# Authenticode здесь не настроен: OV-сертификат/HSM остаётся блокером публичного релиза.
name: release

on:
  push:
    tags: ["v*"]

env:
  VITE_API_URL: ${{ vars.MUZA_API_URL }}
  NEXT_PUBLIC_API_URL: ${{ vars.MUZA_API_URL }}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          # Полная история — ровно ради шага ниже: при depth=1 ссылки
          # refs/remotes/origin/main в клоне нет и сверять предков нечем.
          fetch-depth: 0

      # Тег можно повесить на ЛЮБОЙ коммит, в том числе никогда не бывший в main и
      # не видевший ни одной проверки: триггер здесь — push тега v*, а защиты веток и
      # наборов правил в репозитории нет (действие владельца). Этот шаг — единственная
      # машинная преграда: коммит обязан быть предком origin/main, то есть уже прошедшим
      # trust-gate (там же лежат фронтовые тесты, которых в release.yml нет).
      # Одна команда в блоке: её код возврата и есть код шага, преамбула не нужна.
      - name: Тег стоит на коммите из main
        shell: pwsh
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/desktop/src-tauri

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Нативный аудио-движок (10.08) тянет две сборочные зависимости, которых
      # у проекта раньше не было: libopus собирается через cmake, а вокодер
      # скорости — через bindgen, которому нужен libclang из LLVM. На образе
      # windows-latest оба инструмента есть, но каталог LLVM не в PATH, и
      # bindgen падает с «Unable to find libclang». Проверяем ЯВНО и до первой
      # компиляции Rust: понятная ошибка здесь лучше невнятной посреди сборки.
      # ⚠️ Без $PSNativeCommandUseErrorActionPreference: гейт считает эту строку
      # пошагово и требует её ровно там, где в шаге НЕСКОЛЬКО гейт-команд.
      # Здесь их нет, а от невыполнения защищает throw ниже.
      - name: Инструменты нативного звука
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --version
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            throw "libclang.dll не найден в $llvmBin — bindgen не соберётся"
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Проверенные sidecar-бинари
        shell: pwsh
        run: |
          $triple = 'x86_64-pc-windows-msvc'
          $binDir = 'apps/desktop/src-tauri/bin'
          $ytDlpPath = Join-Path $binDir "yt-dlp-$triple.exe"
          $tempRoot = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $denoZip = Join-Path $tempRoot 'deno-x86_64-pc-windows-msvc.zip'
          $denoExtract = Join-Path $tempRoot 'deno-v2.9.2'
          $denoPath = Join-Path $binDir "deno-$triple.exe"

          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.06.09/yt-dlp.exe' -OutFile $ytDlpPath
          if ((Get-FileHash -LiteralPath $ytDlpPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3a48cb955d55c8821b60ccbdbbc6f61bc958f2f3d3b7ad5eaf3d83a543293a27') { throw 'yt-dlp checksum mismatch' }

          Invoke-WebRequest -Uri 'https://github.com/denoland/deno/releases/download/v2.9.2/deno-x86_64-pc-windows-msvc.zip' -OutFile $denoZip
          if ((Get-FileHash -LiteralPath $denoZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5fe194d26ac5ef77fcc5288c2c438c7a0465f3b6180440ebf04092714bf2dcdf') { throw 'Deno checksum mismatch' }
          Expand-Archive -LiteralPath $denoZip -DestinationPath $denoExtract -Force
          Move-Item -LiteralPath (Join-Path $denoExtract 'deno.exe') -Destination $denoPath -Force
          if (-not (Test-Path -LiteralPath $denoPath -PathType Leaf)) { throw 'Deno sidecar missing after extraction' }

      # Две строки преамбулы в КАЖДОМ многокомандном pwsh-блоке ниже — не украшение.
      # GitHub проверяет только код возврата ПОСЛЕДНЕЙ команды блока, поэтому падение
      # любой команды кроме последней исчезало бесследно. Так v0.1.4 и v0.1.5 уехали с
      # молча провалившимся гейтом наименьших привилегий: в логе прогона v0.1.5 стоит
      # "main capability permission set mismatch", а джоба зелёная (проверено 2026-08-01).
      # $PSNativeCommandUseErrorActionPreference превращает ненулевой код нативной
      # команды в терминирующую ошибку; на pwsh старше 7.3 переменная просто
      # проигнорируется, поэтому строка безопасна и на других раннерах.
      - name: Node trust tests и API env
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --test scripts/release-gate.test.mjs
          node scripts/release-gate.mjs env VITE_API_URL
          node scripts/release-gate.mjs env NEXT_PUBLIC_API_URL

      # Номер версии живёт в шести местах, и ни одно не выводится из тега. Тег v0.1.6 на
      # дереве 0.1.5 собрался бы зелёным и дал два вранья: манифест обновлений с версией
      # 0.1.5 (все, кто уже на 0.1.5, услышат «установлена последняя») и лендинг с
      # «Muza v0.1.6» со ссылкой на Muza_0.1.5_x64-setup.exe. Шаг стоит ДО сборки —
      # падать надо до Rust-компиляции, а не после неё. Одна команда, преамбула не нужна.
      - name: Тег совпадает с версией дерева
        shell: pwsh
        run: node scripts/release-gate.mjs version $env:GITHUB_REF_NAME

      - name: Rust tests и schema check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Production frontend builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm --filter muza-desktop build
          pnpm --filter muza-web build

      - name: Exact config, capability, workflow и artifact gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/release-gate.mjs tauri apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/tauri.dev.conf.json
          node scripts/release-gate.mjs capabilities apps/desktop/src-tauri/capabilities/main.json apps/desktop/src-tauri/capabilities/mini.json
          node scripts/release-gate.mjs workflows .github/workflows/release.yml .github/workflows/trust-gate.yml
          node scripts/release-gate.mjs artifacts apps/desktop/dist apps/web/out

      - name: Сборка и draft-релиз
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Muza ${{ github.ref_name }}"
          releaseBody: "Что нового — см. коммиты. Установщик проверяет подпись обновлений автоматически."
          releaseDraft: true
          includeUpdaterJson: true
