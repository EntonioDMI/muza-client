[package]
name = "muza-desktop"
version = "0.3.2"
description = "Muza — музыкальный плеер"
edition = "2021"

[lib]
name = "muza_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Зависимости оптимизируем даже в отладочной сборке. Нативный аудио-движок
# декодирует и ресемплит в реальном времени: в debug symphonia, rubato и
# libopus не успевают за выводом, и звук в dev-режиме хрипит и заикается
# (жалоба владельца 10.08). Наш собственный код остаётся неоптимизированным —
# отладка не страдает, а пересборка зависимостей разовая.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: подпись рецепта — над байтами JSON.stringify сервера,
# порядок ключей при ре-сериализации обязан сохраняться
serde_json = { version = "1", features = ["preserve_order"] }
# Движок добычи (Stage 3): проверка Ed25519-подписи горячего рецепта,
# single-flight резолвов, LRU-touch файлов кэша
ed25519-dalek = "2"
base64 = "0.22"
# time — таймауты ожидания байт в протоколе muza-stream (Фаза 2); фича и так
# активна в графе через tauri, запись здесь лишь делает зависимость честной.
# macros — select! в отменяемой закачке стрима (снос неподтверждённой, К4).
tokio = { version = "1", features = ["sync", "net", "time", "macros"] }
filetime = "0.2"
# Канонический разбор provider URL на нативной SSRF-границе.
url = "2"
# Discord Rich Presence (Stage 3, слайс 7)
discord-rich-presence = "0.2"
lofty = "0.24.0"
sha2 = "0.11.0"
# Единственный экземпляр (жалоба владельца 19.07: закрыл в трей → ярлык
# плодил вторую Музу, копии копились). Второй запуск теперь только
# показывает уже живое окно (tray::show_main в колбэке init).
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2.7.1"
# Автозапуск с системой (настройки → Система)
tauri-plugin-autostart = "2"
# Открытие внешних ссылок в системном браузере (Last.fm-авторизация и т.п.)
tauri-plugin-opener = "2"
# Автообновление с GitHub Releases (Stage 8): подпись updater-ключом,
# pubkey и endpoint — в tauri.conf.json; process — для relaunch после установки
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Нативный drag-out: перетаскивание трека из приложения на рабочий стол
# (файл из кэша добычи с человеческим именем; CrabNebula drag-rs)
tauri-plugin-drag = "2.1.1"
# Плагины уровня 1 (T44, plugins.rs): распаковка .muzaplugin (zip-slip/бомба
# защита через enclosed_name()+лимит), net.fetch (reqwest уже в дереве через
# tauri-plugin-updater — тот же rustls-бэкенд, версия уже разрешена в
# Cargo.lock, доп. компиляции почти нет). Парсинг URL для net_allow — крейт
# `url` уже объявлен выше (SSRF-граница remediation), общий.
zip = { version = "4", default-features = false, features = ["deflate"] }
# socks (отчёт O, 22.07): системный прокси Windows иногда приходит из PAC как
# SOCKS-таргет (частый случай у DPI-обходчиков) — reqwest 0.13.4 реализует
# CONNECT сам поверх уже разрешённых hyper/tokio, проверено: cargo check не
# тянет ни одной новой строки в Cargo.lock (0 новых крейтов).
# hickory-dns (13.08): БЕЗ этой фичи reqwest резолвит имя через системный
# getaddrinfo НА КАЖДЫЙ запрос и ничего не кэширует в процессе. Для SoundCloud
# это почти бесплатно — он всегда отдаёт с одного хоста cf-media.sndcdn.com, и
# соединение переиспользуется пулом. А googlevideo выдаёт КАЖДОМУ ТРЕКУ свой
# хост вида rr3---sn-xxxx.googlevideo.com, то есть у YouTube новый резолв на
# каждый клик. Замер 13.08 показал ровно такой перекос: SoundCloud 854 мс
# медианы против 1687 у YouTube при ЗДОРОВОМ резолве ступени 0 (342–508 мс) —
# всё лишнее время уходит на первый байт.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks", "hickory-dns"] }
# CSPRNG для nonce/staging-токена плагинов (T44-fix: security review) — версия
# зафиксирована на уже разрешённой в дереве (tauri сама тянет getrandom 0.3.4),
# доп. компиляции почти нет
getrandom = "0.3"
cpal = "0.16"
# ⚠️ Список фич ОБЯЗАН покрывать AUDIO_EXT из local.rs. Расходится — файл
# добавляется в реестр (теги читает lofty, ей фичи symphonia не нужны) и молча
# не играет: декодера нет. Так было с aiff и m4a-ALAC до 12.08.
# `aiff` — формат (symphonia-format-riff), `alac` — кодек внутри isomp4/caf.
# wma и ape не добавить: декодеров для них у symphonia нет вовсе (фича `ape` в
# symphonia — это ЧТЕНИЕ ТЕГОВ APEv2, а не звук), поэтому их нет и в AUDIO_EXT.
symphonia = { version = "0.6.0", features = ["mkv", "isomp4", "aac", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "aiff", "alac"] }
symphonia-adapter-libopus = "0.3.0"
rubato = "4.0.0"
audioadapter-buffers = "4"
rustfft = "6.4.1"
signalsmith-stretch = "0.1.3"

# Системный прокси Windows для добычи (отчёт O, 22.07): sysproxy.rs, только
# Windows-таргет. Версия 0.61 уже разрешена в дереве через tao/wry/tauri
# (cargo tree -i windows@0.61.3) — вторую мажорную не плодим. Win32_Foundation
# несёт GlobalFree/HGLOBAL (освобождение строк WinHTTP-конфига).
#
# Win32_UI_WindowsAndMessaging добавлен 03.08 для window_visibility.rs: страница
# в WebView2 НЕ узнаёт, что окно свёрнуто (замер — docs/subsystems/
# производительность-интерфейса.md), поэтому состояние окна спрашиваем у системы.
#
# Win32_System_Threading добавлен 03.08 для wait_with_timeout (engine.rs):
# ожидание yt-dlp было опросом в цикле со сном — сотни пробуждений в секунду на
# каждой добыче и на каждом фоновом прогреве; теперь поток паркуется на хендле
# процесса. Новых крейтов не нужно — только фича уже присутствующего windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Networking_WinHttp",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
] }
